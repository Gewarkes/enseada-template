{% extends 'base.html' %}
{% block main %}
<div class="wrap">
  <ol class="crumbs"><li><a href="{{ url('home') }}">{{ t.navHome }}</a></li><li aria-current="page">{{ t.navGuide }}</li></ol>
  <div class="page-head"><h1>{{ t.blogH }}</h1><p>{{ t.blogLead }}</p></div>
  <div class="posts" style="padding-bottom:56px">
    {% for p in posts %}{{ m.post(p) }}{% endfor %}
  </div>
</div>
<section class="sec sec-soft">
  <div class="wrap">
    <div class="sec-head"><div><h2>{{ t.fqH }}</h2></div></div>
    {{ m.faq(5) }}
  </div>
</section>
{{ m.ctaband(t.blogCtaH, t.blogCtaP, site.media.cta) }}
{% endblock %}
