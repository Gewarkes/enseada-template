<style>
/* Startseite: Foto zuerst, wenig Text, ein Lesefluss von oben nach unten (Aufbau wie bei den großen Maklerhäusern) */
.hx{background:var(--paper)}
.hx-eye{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hx-h{font-size:clamp(34px,4.6vw,62px);line-height:1.04;color:var(--fg)}
.hx-head{text-align:center;max-width:760px;margin:0 auto 54px;display:grid;gap:16px}
.hx-head p{color:var(--mute);font-size:17px;line-height:1.6}
.hx-sec{padding:110px 0}
.hx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 30px;border-radius:999px;background:var(--fg);color:var(--paper);font-weight:600;font-size:15px;border:1px solid var(--fg);transition:background .2s,color .2s}
.hx-btn:hover{background:transparent;color:var(--fg)}
.hx-btn--line{background:transparent;color:var(--fg);border-color:var(--edge)}
.hx-btn--line:hover{background:var(--fg);color:var(--paper)}
.hx-btn--wa{background:var(--wa);border-color:var(--wa);color:#fff}
.hx-btn--wa:hover{background:#178f4a;border-color:#178f4a;color:#fff}
.hx-btn .ico{width:18px;height:18px}

/* 1 Kopfbild als Erzählung: die Bühne bleibt stehen, beim Scrollen wechseln Foto und Satz */
.hx-t{font-family:var(--font)!important;font-weight:500!important;letter-spacing:-.035em!important}
.hx-t em{font-family:var(--serif);font-style:italic;font-weight:500;letter-spacing:-.01em}
.hx-story{position:relative;height:calc(var(--n,4)*85vh);color:#fff}
.hx-story__stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#070b0a}
.hx-scene{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1s ease}
.hx-scene.on{opacity:1}
.hx-scene img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 6s ease-out}
.hx-scene.on img{transform:scale(1)}
.hx-story__shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,10,.6) 0%,rgba(7,11,10,.14) 26%,rgba(7,11,10,.34) 56%,rgba(7,11,10,.9) 100%)}
.hx-story__in{position:absolute;inset:0;margin:0 auto}
.hx-say{position:absolute;left:var(--gut,30px);bottom:190px;max-width:620px;display:grid;gap:18px;justify-items:start;opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;pointer-events:none}
.hx-say.on{opacity:1;transform:none;pointer-events:auto}
.hx-say--r{left:auto;right:var(--gut,30px);text-align:right;justify-items:end}
.hx-say .hx-eye{color:#fff;opacity:.85}
.hx-big{font-size:clamp(44px,6.6vw,96px);line-height:.98;text-shadow:0 2px 34px rgba(0,0,0,.4)}
.hx-say p{font-size:clamp(16px,1.4vw,19px);line-height:1.55;max-width:460px;color:rgba(255,255,255,.92)}
.hx-story__bar{position:absolute;left:0;right:0;bottom:0;padding:0 0 34px}
.hx-story__barin{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:22px;border-top:1px solid rgba(255,255,255,.22)}
.hx-story__meta{display:flex;gap:34px;font-size:13px;color:rgba(255,255,255,.75);letter-spacing:.02em}
.hx-story__meta b{display:block;font-size:22px;font-weight:600;color:#fff;letter-spacing:-.02em}
.hx-dots{display:flex;gap:8px}
.hx-dots i{width:26px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);transition:background .4s,width .4s}
.hx-dots i.on{background:#fff;width:46px}
.hx-find{display:flex;flex-wrap:wrap;gap:4px;padding:5px;border-radius:999px;background:rgba(13,18,17,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22)}
.hx-find a{height:44px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;font-weight:600;font-size:14px;color:#fff;transition:background .2s,color .2s}
.hx-find a:hover{background:rgba(255,255,255,.16)}
.hx-find a.on{background:#fff;color:#0d1211}
@media (prefers-reduced-motion:reduce){.hx-scene,.hx-scene img,.hx-say{transition:none}}
@media (max-width:980px){.hx-story__meta{display:none}}
@media (max-width:640px){
  .hx-story{height:calc(var(--n,4)*75vh)}
  .hx-say,.hx-say--r{left:20px;right:20px;bottom:150px;text-align:left;justify-items:start}
  .hx-story__bar{padding-bottom:20px}
  .hx-story__barin{justify-content:flex-start;padding-top:14px;padding-right:64px}
  .hx-big{font-size:46px}
  .hx-dots{display:none}
  .hx-find{width:100%;justify-content:space-between;border-radius:22px}
  .hx-find a{flex:1 1 auto;justify-content:center;padding:0 10px;height:42px;font-size:13px}
}

/* 2 Objekt der Woche */
.hx-feat{display:block;position:relative;border-radius:var(--r);overflow:hidden}
.hx-feat__ph{aspect-ratio:16/8;overflow:hidden;border-radius:var(--r)}
.hx-feat__ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.hx-feat:hover .hx-feat__ph img{transform:scale(1.03)}
.hx-feat__tag{position:absolute;left:22px;top:22px;padding:8px 16px;border-radius:999px;background:rgba(13,18,17,.6);backdrop-filter:blur(10px);color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.hx-feat__b{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;padding:30px 4px 0}
.hx-feat__b h3{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,48px);line-height:1.05;color:var(--fg)}
.hx-loc{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
.hx-facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;color:var(--mute);font-size:15px}
.hx-facts b{color:var(--fg);font-weight:600}
.hx-price{font-size:clamp(22px,2.2vw,30px);font-weight:600;color:var(--fg);white-space:nowrap;text-align:right}
.hx-price small{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-top:6px}

/* 3 Raster */
.hx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.hx-card{display:block}
.hx-card__ph{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--white)}
.hx-card__ph img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.hx-card:hover .hx-card__ph img{transform:scale(1.05)}
.hx-card__tag{position:absolute;left:14px;top:14px;padding:6px 12px;border-radius:999px;background:rgba(13,18,17,.62);backdrop-filter:blur(8px);color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.hx-card__b{padding:20px 4px 0}
.hx-card h3{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;color:var(--fg)}
.hx-card .hx-loc{font-size:12px;margin-bottom:8px}
.hx-card .hx-facts{font-size:14px;margin-top:10px}
.hx-card__p{margin-top:12px;font-size:18px;font-weight:600;color:var(--fg)}
.hx-more{display:flex;justify-content:center;margin-top:56px}

/* Rechner */
.hx-calc{max-width:980px;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:36px}
.hx-calc .fx{margin-top:18px;color:var(--mute);font-size:13px}
@media (max-width:640px){.hx-calc{padding:20px}}

/* 4 Kategorien */
.hx-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.hx-cat{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;color:#fff}

.hx-cat span{font-size:14px;opacity:.85;display:block;margin-top:8px}

.hx-cat:hover i{background:#fff;color:#0d1211}
.hx-cat i .ico{width:18px;height:18px}

/* 5 Über uns */
.hx-band{background:var(--ink)}
.hx-about{display:grid;grid-template-columns:1.05fr 1fr;gap:70px;align-items:center}
.hx-about__ph{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden}
.hx-about__ph img{width:100%;height:100%;object-fit:cover}
.hx-about__t{display:grid;gap:22px;justify-items:start}
.hx-about__t p{color:var(--mute);font-size:18px;line-height:1.65;max-width:520px}
.hx-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 40px;margin:14px 0 10px;width:100%;max-width:520px;padding-top:30px;border-top:1px solid var(--line)}
.hx-stats b{display:block;font-family:var(--font)!important;font-weight:500;font-size:76px!important;letter-spacing:-.04em!important;line-height:1;color:var(--fg);font-variant-numeric:lining-nums}
.hx-stats span{display:block;margin-top:8px;font-size:14px;color:var(--mute)}

/* 6 Stimme */
.hx-quote{text-align:center;max-width:900px;margin:0 auto;display:grid;gap:30px;justify-items:center}
.hx-quote blockquote{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(26px,3.2vw,42px);line-height:1.25;color:var(--fg)}
.hx-quote cite{font-style:normal;font-size:15px;color:var(--mute)}
.hx-quote cite b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* 7 Blog */
.hx-post{display:block}
.hx-post__ph{aspect-ratio:3/2;border-radius:var(--r);overflow:hidden;background:var(--white)}
.hx-post__ph img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.hx-post:hover .hx-post__ph img{transform:scale(1.05)}
.hx-post h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;color:var(--fg);margin:8px 0 10px}
.hx-post p{color:var(--mute);font-size:15px;line-height:1.55}
.hx-post .hx-loc{margin:20px 0 0;font-size:12px}

/* 8 Fragen */
.hx-faq{max-width:820px;margin:0 auto}
.hx-faq details{border-bottom:1px solid var(--line)}
.hx-faq details:first-of-type{border-top:1px solid var(--line)}
.hx-faq summary{list-style:none;cursor:pointer;padding:26px 44px 26px 0;position:relative;font-size:20px;font-weight:500;color:var(--fg)}
.hx-faq summary::-webkit-details-marker{display:none}
.hx-faq summary::after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:300;color:var(--gold)}
.hx-faq details[open] summary::after{content:"–"}
.hx-faq p{padding:0 44px 28px 0;color:var(--mute);font-size:17px;line-height:1.65}

/* 9 Abschluss */
.hx-cta{position:relative;border-radius:var(--r);overflow:hidden;min-height:520px;display:grid;place-items:center;text-align:center;color:#fff}
.hx-cta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hx-cta::after{content:"";position:absolute;inset:0;background:rgba(7,11,10,.58)}
.hx-cta__in{position:relative;z-index:1;padding:70px 24px;display:grid;gap:24px;justify-items:center;max-width:760px}
.hx-cta h2{font-size:clamp(36px,5vw,68px);line-height:1.02}
.hx-cta p{font-size:18px;line-height:1.55;color:rgba(255,255,255,.9);max-width:520px}
.hx-cta__btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

@media (max-width:980px){
  .hx-sec{padding:76px 0}
  .hx-grid,.hx-cats{grid-template-columns:1fr 1fr;gap:20px}
  .hx-about{grid-template-columns:1fr;gap:40px}
  .hx-about__ph{aspect-ratio:4/3}
  .hx-feat__ph{aspect-ratio:4/3}
  .hx-feat__b{flex-direction:column;align-items:flex-start;gap:18px}
  .hx-price{text-align:left}
}
@media (max-width:640px){
  .hx-sec{padding:64px 0}
  .hx-head{margin-bottom:36px}
  .hx-grid,.hx-cats{grid-template-columns:1fr;gap:34px}
  .hx-cat{aspect-ratio:4/3}
  .hx-stats b{font-size:46px}
  .hx-faq summary{font-size:18px}
  .hx-cta{min-height:460px}
  .hx-btn{width:100%}
}

  const card=l=>`<a class="hx-card" href="#imovel-${l.slug}"><div class="hx-card__ph"><img ${srcs(l.imgs[0])} alt="${esc(l.name)}" loading="lazy"><span class="hx-card__tag">${tagText(l)}</span></div><div class="hx-card__b"><div class="hx-loc">${esc(l.loc)}</div><h3>${esc(l.name)}</h3>${facts(l)}<div class="hx-card__p num">${price(l)}</div></div></a>`;
  const cnt=n=>`${n} ${tr(n===1?'hx_n1':'hx_n')}`;
  VIEWS.home={
    title(){return tr('hx_title')},
    mount(root){
      const st=root.querySelector('[data-story]');if(window.__hxS){removeEventListener('scroll',window.__hxS);removeEventListener('resize',window.__hxS);window.__hxS=null}
      if(!st)return;const sc=[...st.querySelectorAll('.hx-scene')],say=[...st.querySelectorAll('.hx-say')],dots=[...st.querySelectorAll('.hx-dots i')],n=sc.length;let cur=0,tick=false;
      const set=k=>{if(k===cur)return;cur=k;[sc,say,dots].forEach(a=>a.forEach((e,i)=>e.classList.toggle('on',i===k)))};
      const on=()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;const r=st.getBoundingClientRect(),h=r.height-innerHeight;if(h<=0)return;const p=Math.min(.999,Math.max(0,-r.top/h));set(Math.floor(p*n))})};
      window.__hxS=on;addEventListener('scroll',on,{passive:true});addEventListener('resize',on);on()
    },
    render(){
      const all=SITE.listings,houses=all.filter(l=>l.type!=='terreno'&&l.deal==='venda');
      const feat=all.find(l=>l.feat)||houses[0]||all[0];
      const grid=houses.filter(l=>l!==feat).slice(0,3);
      const rent=all.filter(l=>l.deal==='aluguel'),land=all.filter(l=>l.type==='terreno'),buy=all.filter(l=>l.deal==='venda'&&l.type!=='terreno');
      const pic=(a,f)=>(a[0]&&a[0].imgs[0])||f;
      const m=SITE.media,s=SITE.stats,hero=m.heroPoster;
      const sc=[{i:hero},{i:m.story2},{i:feat?feat.imgs[0]:m.proof},{i:(grid[0]&&grid[0].imgs[0])||m.story1}];
      const cat=(h,t,a,p)=>`<a class="hx-cat" href="#${h}"><img ${srcW(p)} alt="${tr(t)}" loading="lazy"><div class="hx-cat__b"><div><h3>${tr(t)}</h3><span>${cnt(a.length)}</span></div><i>${icon('arrow')}</i></div></a>`;
      return `<div class="hx">
<section class="hx-story" data-story style="--n:${sc.length}">
  <div class="hx-story__stage">
    ${sc.map((x,k)=>`<figure class="hx-scene${k?'':' on'}" data-k="${k}">${k?`<img ${srcW(x.i)} alt="${esc(tr('hx_c'+k).replace(/<[^>]+>/g,''))}" loading="lazy">`:`<img src="${img(x.i)}" srcset="${imgS(x.i)} 760w, ${img(x.i)} 1400w" sizes="100vw" fetchpriority="high" alt="${tr('hx_alt')}">`}</figure>`).join('')}
    <div class="hx-story__shade"></div>
    <div class="wrap hx-story__in">
      ${sc.map((x,k)=>`<div class="hx-say${k%2?' hx-say--r':''}${k?'':' on'}" data-k="${k}"><div class="hx-eye">${tr(k?'hx_c'+k+'e':'hx_eye')}</div>${k?`<h2 class="hx-t hx-big">${tr('hx_c'+k)}</h2>`:`<h1 class="hx-t hx-big">${tr('hx_h1')}</h1>`}<p>${tr(k?'hx_c'+k+'p':'hx_sub')}</p>${k===sc.length-1?`<a class="hx-btn" href="#imoveis">${tr('hx_all')}</a>`:''}</div>`).join('')}
    </div>
    <div class="hx-story__bar"><div class="wrap hx-story__barin">
      <nav class="hx-find" aria-label="${tr('hx_buy')}"><a class="on" href="#imoveis-venda">${tr('hx_buy')}</a><a href="#imoveis-aluguel">${tr('hx_rent')}</a><a href="#imoveis-terrenos">${tr('hx_land')}</a><a href="#calc">${tr('hx_fi_e')}</a></nav>
      <div class="hx-story__meta num"><span><b>${all.length}</b> ${tr('hx_n')}</span><span><b>${s.years}</b> ${tr('hx_s2')}</span><span><b>${nf(s.rating,1)}</b> ${tr('hx_s4')}</span></div>
      <div class="hx-dots" aria-hidden="true">${sc.map((x,k)=>`<i class="${k?'':'on'}"></i>`).join('')}</div>
    </div></div>
  </div>
</section>
${feat?`<section class="hx-sec" style="padding-top:40px"><div class="wrap">
  <a class="hx-feat" href="#imovel-${feat.slug}">
    <div class="hx-feat__ph"><img ${srcW(feat.imgs[0])} alt="${esc(feat.name)}"></div><span class="hx-feat__tag">${tr('hx_week')}</span>
    <div class="hx-feat__b"><div><div class="hx-loc">${esc(feat.loc)}</div><h3>${esc(feat.name)}</h3>${facts(feat)}</div><div class="hx-price num">${price(feat)}<small>${tr('hx_view')} →</small></div></div>
  </a></div></section>`:''}
${grid.length?`<section class="hx-sec" style="padding-top:20px"><div class="wrap">
  <div class="hx-head"><div class="hx-eye">${tr('hx_sel_e')}</div><h2 class="hx-h hx-t">${tr('hx_sel_h')}</h2><p>${tr('hx_sel_p')}</p></div>
  <div class="hx-grid">${grid.map(card).join('')}</div>
  <div class="hx-more"><a class="hx-btn hx-btn--line" href="#imoveis">${tr('hx_all')}</a></div>
</div></section>`:''}
${feat&&feat.deal==='venda'?`<section class="hx-sec hx-band" id="calc"><div class="wrap">
  <div class="hx-head"><div class="hx-eye">${tr('hx_fi_e')}</div><h2 class="hx-h hx-t">${tr('hx_fi_h')}</h2><p>${tr('hx_fi_p')}</p></div>
  <div class="hx-calc"><div class="calc">${calcHTML(feat.price)}</div><p class="fx num">${fxText()}</p></div>
</div></section>`:''}
<section class="hx-sec"><div class="wrap">
  <div class="hx-head"><div class="hx-eye">${tr('hx_cat_e')}</div><h2 class="hx-h hx-t">${tr('hx_cat_h')}</h2></div>
  <div class="hx-cats">${cat('imoveis-venda','hx_buy',buy,pic(buy.slice(1),m.proof))}${cat('imoveis-aluguel','hx_rent',rent,pic(rent,m.story1))}${cat('imoveis-terrenos','hx_land',land,pic(land,m.values))}</div>
</div></section>
<section class="hx-sec" style="padding-top:0"><div class="wrap hx-about">
  <div class="hx-about__ph"><img ${srcW(m.about)} alt="${tr('hx_alt2')}" loading="lazy"></div>
  <div class="hx-about__t"><div class="hx-eye">${tr('hx_ab_e')}</div><h2 class="hx-h hx-t">${tr('hx_ab_h')}</h2><p>${tr('hx_ab_p').replace('{y}',s.years)}</p>
    <div class="hx-stats num"><div><b data-count="${s.sold}">${s.sold}</b><span>${tr('hx_s1')}</span></div><div><b data-count="${s.years}">${s.years}</b><span>${tr('hx_s2')}</span></div><div><b data-count="${s.countries}">${s.countries}</b><span>${tr('hx_s3')}</span></div><div><b data-count="${s.rating}" data-dec="1">${nf(s.rating,1)}</b><span>${tr('hx_s4')}</span></div></div>
    <a class="hx-btn hx-btn--line" href="#sobre">${tr('hx_ab_l')}</a></div>
</div></section>
<section class="hx-sec hx-band"><div class="wrap"><div class="hx-quote"><div class="hx-eye">★ ★ ★ ★ ★</div><blockquote>${tr('hx_q')}</blockquote><cite><b>${tr('hx_qn')}</b>${tr('hx_qr')}</cite></div></div></section>
${SITE.posts.length?`<section class="hx-sec"><div class="wrap">
  <div class="hx-head"><div class="hx-eye">${tr('hx_bl_e')}</div><h2 class="hx-h hx-t">${tr('hx_bl_h')}</h2></div>
  <div class="hx-grid">${SITE.posts.slice(0,3).map(p=>`<a class="hx-post" href="#artigo-${p.slug}"><div class="hx-post__ph"><img ${srcs(p.img)} alt="${esc(L(p.title))}" loading="lazy"></div><div class="hx-loc">${esc(L(p.cat))}</div><h3>${esc(L(p.title))}</h3><p>${esc(L(p.excerpt))}</p></a>`).join('')}</div>
  <div class="hx-more"><a class="hx-btn hx-btn--line" href="#blog">${tr('hx_bl_l')}</a></div>
</div></section>`:''}
<section class="hx-sec" style="padding-top:0"><div class="wrap">
  <div class="hx-head"><div class="hx-eye">${tr('hx_fq_e')}</div><h2 class="hx-h hx-t">${tr('fq_h')}</h2></div>
  <div class="hx-faq">${[1,2,3,4].map(i=>`<details${i===1?' open':''}><summary>${tr('fq'+i)}</summary><p>${tr('fq'+i+'a')}</p></details>`).join('')}</div>
</div></section>
<section class="hx-sec" style="padding-top:0"><div class="wrap"><div class="hx-cta"><img ${srcW(m.cta)} alt="${tr('hx_alt3')}" loading="lazy">
  <div class="hx-cta__in"><h2 class="hx-t">${tr('hx_ct_h')}</h2><p>${tr('hx_ct_p')}</p><div class="hx-cta__btns"><a class="hx-btn" href="#contato">${tr('hx_ct_b')}</a><a class="hx-btn hx-btn--wa" href="${waLink()}" target="_blank" rel="noopener">WhatsApp</a></div></div>
</div></div></section>
</div>`}
  };
})();
</script>
