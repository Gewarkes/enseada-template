<style>
/* Liste-1 Seitenkopf (Avenlo, gekürzt) + Liste-3 Umschalter (Avery) */
.v-imoveis .hd{background:var(--stone);text-align:center;padding:96px 0 124px}
.v-imoveis .hd__t{font-size:clamp(40px,6.25vw,90px);line-height:1;font-weight:600;letter-spacing:-.04em;text-wrap:balance}
.v-imoveis .hd__t span{display:block;color:var(--mute);font-weight:300}
.v-imoveis .tg{display:inline-flex;gap:4px;margin-top:40px;padding:6px;background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.v-imoveis .tg a{display:flex;align-items:center;height:44px;padding:0 20px;border-radius:12px;font-size:14px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.v-imoveis .tg a:hover{color:var(--text)}
.v-imoveis .tg a[aria-current="true"]{background:var(--ink);color:#fff}

/* Liste-2 Filterleiste (Homeifye): weiße Leiste, halb auf dem Kopf */
.v-imoveis .fb{position:relative;margin-top:-64px;display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:16px;padding:30px;background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.v-imoveis .fl{position:relative;display:block;height:68px;border:1px solid var(--line);border-radius:var(--r);background:var(--white);transition:border-color .2s}
.v-imoveis .fl:hover{border-color:var(--mute)}
.v-imoveis .fl:focus-within{outline:2px solid var(--sea);outline-offset:2px}
.v-imoveis .fl__l{position:absolute;left:18px;top:11px;font-size:13px;line-height:1.3;font-weight:500;color:var(--mute);pointer-events:none}
.v-imoveis .fl select{appearance:none;-webkit-appearance:none;width:100%;height:100%;padding:26px 44px 0 18px;border:0;background:transparent;font-size:17px;font-weight:500;cursor:pointer;outline:0;text-overflow:ellipsis}
.v-imoveis .fl .ico{position:absolute;right:16px;top:50%;margin-top:-9px;width:18px;height:18px;pointer-events:none}

.v-imoveis .res{padding:48px 0 var(--sec)}
.v-imoveis .cnt{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;margin-bottom:24px;font-size:15px;color:var(--mute)}
.v-imoveis .cnt b{color:var(--text);font-weight:600}
.v-imoveis .clr{background:none;border:0;min-height:44px;padding:0 2px;font-size:14px;font-weight:600;color:var(--text);text-decoration:underline;text-underline-offset:5px}
.v-imoveis .clr:hover{color:var(--sea)}
.v-imoveis .grid{display:grid;grid-template-columns:1fr 1fr;gap:48px 20px;margin-top:20px}
.v-imoveis .grid .pb__loc,.v-imoveis .grid .pb__name,.v-imoveis .grid .pb__data{padding:0 16px}
.v-imoveis .fx{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}

/* leerer Zustand */
.v-imoveis .nil{padding:64px 40px;border:1px solid var(--line);border-radius:var(--r);background:var(--white);text-align:center}
.v-imoveis .nil p{max-width:520px;margin:12px auto 28px;color:var(--mute);text-wrap:pretty}
.v-imoveis .nil__b{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.v-imoveis .wai{display:inline-flex}
.v-imoveis .wai svg{width:18px;height:18px;fill:currentColor}

/* Liste-4 Kompaktliste Grundstücke (Avenlo): links klebendes hohes Bild, rechts Zeilen */
.v-imoveis .tl{display:grid;grid-template-columns:563fr 669fr;gap:48px;align-items:start}
.v-imoveis .tl__pic{position:sticky;top:24px;aspect-ratio:563/706;border-radius:var(--r);overflow:hidden;background:var(--stone)}
.v-imoveis .tl__pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.v-imoveis .tl__pic img.on{opacity:1}
.v-imoveis .tl__rows{border-bottom:1px solid var(--line)}
.v-imoveis .tl__row{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:98px;padding:24px 0;border-top:1px solid var(--line);color:var(--mute);transition:color .25s}
.v-imoveis .tl__row.on,.v-imoveis .tl__row:hover,.v-imoveis .tl__row:focus-visible{color:var(--text)}
.v-imoveis .tl__th{display:none}
.v-imoveis .tl__tx{display:block;min-width:0}
.v-imoveis .tl__n{display:block;font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.02em}
.v-imoveis .tl__l{display:block;font-size:16px;line-height:1.4;color:var(--mute);margin-top:2px}
.v-imoveis .tl__c{display:flex;gap:6px;flex:none}
.v-imoveis .tl__c span{padding:5px 10px;border-radius:12px;background:var(--stone);font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;color:var(--text)}

/* Liste-5 Abschlussband (Avery) */
.v-imoveis .end{padding:120px 0}
.v-imoveis .end__g{display:grid;grid-template-columns:630fr 410fr;gap:100px;align-items:center}
.v-imoveis .end__t{font-size:clamp(30px,2.9vw,42px);line-height:1.1;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
.v-imoveis .end__p{margin-top:14px;max-width:520px;color:var(--mute-d);text-wrap:pretty}
.v-imoveis .end__b{justify-self:end}

@media (max-width:980px){
  .v-imoveis .fb{grid-template-columns:1fr 1fr}
}
@media (max-width:860px){
  .v-imoveis .hd{padding:56px 0 76px}
  .v-imoveis .tg{margin-top:28px;display:flex;width:100%}
  .v-imoveis .tg a{flex:1;justify-content:center;padding:0 8px}
  .v-imoveis .fb{margin-top:-40px;padding:16px;gap:12px}
  .v-imoveis .fb--3 .fl:first-child{grid-column:1/-1}
  .v-imoveis .fl{height:64px}
  .v-imoveis .fl__l{left:14px;top:10px}
  .v-imoveis .fl select{padding:24px 34px 0 14px;font-size:16px}
  .v-imoveis .fl .ico{right:10px}
  .v-imoveis .res{padding-top:32px}
  .v-imoveis .grid{grid-template-columns:1fr;gap:32px;margin-top:12px}
  .v-imoveis .grid .pb__loc,.v-imoveis .grid .pb__name,.v-imoveis .grid .pb__data{padding:0}
  .v-imoveis .nil{padding:40px 20px}
  .v-imoveis .tl{display:block}
  .v-imoveis .tl__pic{display:none}
  .v-imoveis .tl__row{display:grid;grid-template-columns:104px 1fr;gap:6px 16px;align-items:center;padding:16px 0}
  .v-imoveis .tl__th{display:block;grid-row:1/3;width:104px;height:104px;border-radius:var(--r);object-fit:cover}
  .v-imoveis .tl__tx{align-self:end}
  .v-imoveis .tl__c{align-self:start;flex-wrap:wrap}
  .v-imoveis .tl__row{color:var(--text)}
  .v-imoveis .fx{margin-top:40px}
  .v-imoveis .end{padding:76px 0}
  .v-imoveis .end__g{grid-template-columns:1fr;gap:28px}
  .v-imoveis .end__b{justify-self:start}
}
</style>
<script>
addDict({
pt:{im_t_all:'Imóveis em Pipa',im_s_all:'à venda e para alugar',im_t_venda:'Imóveis à venda',im_t_aluguel:'Casas para alugar',im_t_terrenos:'Terrenos',im_s:'em Pipa',
 im_buy:'Comprar',im_rent:'Alugar',im_land:'Terrenos',im_tg:'Tipo de negócio',im_fb:'Filtros',
 im_loc:'Local',im_type:'Tipo',im_max:'Preço até',im_beds:'Quartos',im_area:'Área mínima',
 im_anyloc:'Todos os locais',im_anytype:'Todos os tipos',im_anyprice:'Sem limite',im_any:'Qualquer',im_upto:'até',im_ormore:'ou mais',im_from:'a partir de',
 im_n1:'imóvel encontrado',im_nn:'imóveis encontrados',im_clear:'Limpar filtros',im_see:'Ver imóvel',
 im_nil_t:'Nenhum imóvel com esses filtros',im_nil_p:'Parte da carteira não está anunciada. Diga pelo WhatsApp o que procura e em qual região, e avisamos quando houver um imóvel que combine.',
 im_wa:'Enviar pedido de busca',
 im_end_t:'Nem todo imóvel chega ao anúncio',im_end_p:'Diga o que procura, a região e o valor. Avisamos pelo WhatsApp quando entrar um imóvel que combine, inclusive os que ainda não foram anunciados.'},
en:{im_t_all:'Property in Pipa',im_s_all:'for sale and to rent',im_t_venda:'Property for sale',im_t_aluguel:'Houses to rent',im_t_terrenos:'Land',im_s:'in Pipa',
 im_buy:'Buy',im_rent:'Rent',im_land:'Land',im_tg:'Type of deal',im_fb:'Filters',
 im_loc:'Location',im_type:'Type',im_max:'Price up to',im_beds:'Bedrooms',im_area:'Minimum area',
 im_anyloc:'All locations',im_anytype:'All types',im_anyprice:'No limit',im_any:'Any',im_upto:'up to',im_ormore:'or more',im_from:'from',
 im_n1:'listing found',im_nn:'listings found',im_clear:'Clear filters',im_see:'View property',
 im_nil_t:'No listings match these filters',im_nil_p:'Part of our portfolio is not advertised. Tell us on WhatsApp what you are looking for and where, and we will let you know when a matching property comes in.',
 im_wa:'Send a search request',
 im_end_t:'Not every property gets advertised',im_end_p:'Tell us what you are looking for, the area and the budget. We will message you on WhatsApp when a matching property comes in, including those not yet listed.'},
de:{im_t_all:'Immobilien in Pipa',im_s_all:'zum Kauf und zur Miete',im_t_venda:'Immobilien zum Kauf',im_t_aluguel:'Häuser zur Miete',im_t_terrenos:'Grundstücke',im_s:'in Pipa',im_buy:'Kaufen',im_rent:'Mieten',im_land:'Grundstücke',im_tg:'Art des Angebots',im_fb:'Filter',im_loc:'Lage',im_type:'Objektart',im_max:'Preis bis',im_beds:'Schlafzimmer',im_area:'Mindestfläche',im_anyloc:'Alle Lagen',im_anytype:'Alle Arten',im_anyprice:'Kein Limit',im_any:'Beliebig',im_upto:'bis',im_ormore:'oder mehr',im_from:'ab',im_n1:'Objekt gefunden',im_nn:'Objekte gefunden',im_clear:'Filter zurücksetzen',im_see:'Objekt ansehen',im_nil_t:'Kein Objekt passt zu diesen Filtern',im_nil_p:'Ein Teil unseres Bestands ist nicht inseriert. Schreiben Sie uns per WhatsApp, was Sie suchen und in welcher Gegend. Wir melden uns, sobald ein passendes Objekt dabei ist.',im_wa:'Suchanfrage senden',im_end_t:'Nicht jedes Objekt wird inseriert',im_end_p:'Nennen Sie uns Ihre Wünsche, die Gegend und Ihr Budget. Wir schreiben Ihnen per WhatsApp, sobald ein passendes Objekt hereinkommt, auch wenn es noch nicht inseriert ist.'}});

VIEWS.imoveis=(()=>{
  const MODES=['venda','aluguel','terrenos'];
  const STEPS={'':[1000000,2500000,4000000,6000000],venda:[1000000,2500000,4000000,6000000],aluguel:[8000,12000,20000],terrenos:[500000,1000000,1500000]};
  const AREAS=[500,1000,2000],BEDS=[2,3,4];
  const mode=a=>MODES.includes(a)?a:'';
  const st=m=>{const s=APP.state.imoveis||(APP.state.imoveis={loc:'',type:'',max:0,min:0,act:0,mode:m});
    if(s.mode!==m){s.mode=m;s.type='';s.max=0;s.min=0;s.act=0}return s};
  const inMode=(l,m)=>m==='venda'?l.deal==='venda'&&l.type!=='terreno':m==='aluguel'?l.deal==='aluguel':m==='terrenos'?l.type==='terreno':true;
  const find=(m,s)=>SITE.listings.filter(l=>inMode(l,m)&&(!s.loc||l.loc===s.loc)&&(!s.type||l.type===s.type)&&(!s.max||l.price<=s.max)&&(!s.min||(m==='terrenos'?l.lot:l.beds)>=s.min));
  const sel=(f,label,cur,opts)=>`<label class="fl"><span class="fl__l">${label}</span><select id="im-${f}" data-f="${f}">${opts.map(([v,t])=>`<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(t)}</option>`).join('')}</select>${icon('chev')}</label>`;
  const wa=()=>`<a class="btn btn--wa" href="${waLink()}" target="_blank" rel="noopener"><span class="wai">${WA_SVG}</span>${tr('im_wa')}</a>`;
  return {
  title(arg){const m=mode(arg);return m?tr('im_t_'+m)+' '+tr('im_s'):tr('im_t_all')},
  render(arg){const m=mode(arg),s=st(m),list=find(m,s),land=m==='terrenos';
    const locs=[...new Set(SITE.listings.map(l=>l.loc))].sort((a,b)=>a.localeCompare(b,'pt'));
    const types=['casa','apartamento'].concat(m===''?['terreno']:[]);
    const fields=[sel('loc',tr('im_loc'),s.loc,[['',tr('im_anyloc')]].concat(locs.map(x=>[x,x])))];
    if(!land&&m!=='aluguel')fields.push(sel('type',tr('im_type'),s.type,[['',tr('im_anytype')]].concat(types.map(x=>[x,tr('t_'+x)]))));
    if(m==='aluguel')fields.push(sel('type',tr('im_type'),s.type,[['',tr('im_anytype')],['casa',tr('t_casa')],['apartamento',tr('t_apartamento')]]));
    fields.push(sel('max',tr('im_max'),s.max||'',[['',tr('im_anyprice')]].concat(STEPS[m].map(v=>[v,`${tr('im_upto')} ${money(v)}`]))));
    fields.push(land?sel('min',tr('im_area'),s.min||'',[['',tr('im_any')]].concat(AREAS.map(v=>[v,`${tr('im_from')} ${nf(v)} m²`])))
                    :sel('min',tr('im_beds'),s.min||'',[['',tr('im_any')]].concat(BEDS.map(v=>[v,`${v} ${tr('im_ormore')}`]))));
    const active=s.loc||s.type||s.max||s.min;
    const act=Math.min(s.act,Math.max(0,list.length-1));
    let body;
    if(!list.length)body=`<div class="nil"><h2 class="h3">${tr('im_nil_t')}</h2><p>${tr('im_nil_p')}</p><div class="nil__b">${wa()}<button type="button" class="btn btn--line" data-clear>${tr('im_clear')}</button></div></div>`;
    else if(land)body=`<div class="tl"><div class="tl__pic" aria-hidden="true">${list.map((l,i)=>`<img ${srcW(l.imgs[0])} alt="${esc(l.name)}" class="${i===act?'on':''}" data-pic="${i}">`).join('')}</div>
      <ul class="tl__rows">${list.map((l,i)=>`<li><a class="tl__row${i===act?' on':''}" href="#imovel-${l.slug}" data-row="${i}"><img class="tl__th" src="${img(l.imgs[0])}" alt="${esc(l.name)}" loading="lazy"><span class="tl__tx"><span class="tl__n">${esc(l.name)}</span><span class="tl__l">${esc(l.loc)}</span></span><span class="tl__c num"><span>${price(l)}</span><span>${nf(l.lot)} m²</span></span></a></li>`).join('')}</ul></div>`;
    else body=cardBig(list[0],tr('im_see'))+(list.length>1?`<div class="grid">${list.slice(1).map(cardBelow).join('')}</div>`:'');
    return `<div class="v-imoveis">
<section class="hd"><div class="wrap">
  <h1 class="hd__t">${tr('im_t_'+(m||'all'))}<span>${tr(m?'im_s':'im_s_all')}</span></h1>
  <nav class="tg" aria-label="${tr('im_tg')}">${[['venda','im_buy'],['aluguel','im_rent'],['terrenos','im_land']].map(([k,t])=>`<a href="#imoveis-${k}"${m===k?' aria-current="true"':''}>${tr(t)}</a>`).join('')}</nav>
</div></section>
<div class="wrap"><form class="fb fb--${fields.length}" style="--n:${fields.length}" aria-label="${tr('im_fb')}" onsubmit="return false">${fields.join('')}</form></div>
<section class="res"><div class="wrap">
  <div class="cnt" role="status"><span><b class="num">${list.length}</b> ${tr(list.length===1?'im_n1':'im_nn')}</span>${active&&list.length?`<button type="button" class="clr" data-clear>${tr('im_clear')}</button>`:''}</div>
  ${body}
  <p class="fx num">${fxText()}</p>
</div></section>
<section class="end dark"><div class="wrap end__g">
  <div><h2 class="end__t">${tr('im_end_t')}</h2><p class="end__p">${tr('im_end_p')}</p></div>
  <a class="btn btn--light btn--lg end__b" href="${waLink()}" target="_blank" rel="noopener"><span class="wai">${WA_SVG}</span>${tr('im_wa')}</a>
</div></section>
</div>`},
  mount(root,arg){const s=st(mode(arg));
    $$('select[data-f]',root).forEach(e=>e.onchange=()=>{const f=e.dataset.f;s[f]=(f==='max'||f==='min')?+e.value||0:e.value;s.act=0;s.focus=e.id;rerender(true)});
    $$('[data-clear]',root).forEach(b=>b.onclick=()=>{s.loc='';s.type='';s.max=0;s.min=0;s.act=0;s.focus='im-loc';rerender(true)});
    if(s.focus){const e=document.getElementById(s.focus);s.focus=null;if(e)e.focus({preventScroll:true})}
    const rows=$$('[data-row]',root),pics=$$('[data-pic]',root);
    const pick=i=>{s.act=i;rows.forEach((r,k)=>r.classList.toggle('on',k===i));pics.forEach((p,k)=>p.classList.toggle('on',k===i))};
    rows.forEach((r,i)=>{r.addEventListener('mouseenter',()=>pick(i));r.addEventListener('focus',()=>pick(i))})}
  }})();
</script>
