<style>
/* Blog-Übersicht: Kopf mittig · Raster 2 große Spalten · Newsletter-Kasten */
.v-blog .head{padding:60px 0 0;text-align:center}
.v-blog .head__t{max-width:800px;margin:0 auto;font-size:clamp(40px,4.9vw,70px);line-height:1.1;font-weight:600;letter-spacing:-.035em;text-wrap:balance}
.v-blog .head__p{max-width:560px;margin:16px auto 0;color:var(--mute);line-height:1.45;text-wrap:pretty}

.v-blog .grid{padding:100px 0}
.v-blog .grid__g{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.v-blog .post{display:block}
.v-blog .post__ph{position:relative;aspect-ratio:630/479;border-radius:var(--r);border-bottom-left-radius:0;overflow:hidden;background:var(--stone)}
.v-blog .post__ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.v-blog .post:hover .post__ph img{transform:scale(1.03)}
.v-blog .post__meta{position:absolute;left:0;bottom:0;width:70%;min-height:52px;background:var(--paper);border-top-right-radius:var(--r);padding:20px 24px 4px 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:14px;line-height:1.3;font-weight:500}
.v-blog .post__meta i{width:5px;height:5px;border-radius:50%;background:var(--sea);flex:none}
.v-blog .post__t{margin-top:10px;max-width:540px;font-size:clamp(24px,2.5vw,36px);line-height:1.1;font-weight:600;letter-spacing:-.025em;text-wrap:balance}

.v-blog .news{padding:0 0 120px}
.v-blog .news__box{position:relative;border-radius:var(--r);overflow:hidden;min-height:384px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}
.v-blog .news__txt{padding:64px 0 56px 60px;max-width:474px;align-self:center}
.v-blog .news__h{font-size:clamp(28px,3vw,42px);line-height:1.1;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
.v-blog .news__p{margin-top:14px;font-size:18px;line-height:1.5;color:#d5dad7;text-wrap:pretty}
.v-blog .news__f{margin-top:28px}
.v-blog .news__field{display:flex;align-items:center;height:68px;padding:7px;background:var(--white);border-radius:var(--r)}
.v-blog .news__field:focus-within{outline:2px solid var(--sea);outline-offset:3px}
.v-blog .news__field input{flex:1;min-width:0;height:54px;border:0;background:none;padding:0 12px;font-size:16px;color:var(--text);outline:none}
.v-blog .news__field input::placeholder{color:var(--mute)}
.v-blog .news__field .btn{height:54px;flex:none}
.v-blog .news .ok{margin-top:10px;color:#eef0ee}
.v-blog .news__lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.v-blog .news__ph{position:relative;min-height:240px}
.v-blog .news__ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

@media (max-width:860px){
  .v-blog .head{padding-top:36px}
  .v-blog .grid{padding:56px 0 76px}
  .v-blog .grid__g{grid-template-columns:1fr;gap:44px}
  .v-blog .post__meta{width:84%;padding-top:16px}
  .v-blog .news{padding-bottom:76px}
  .v-blog .news__box{grid-template-columns:1fr}
  .v-blog .news__txt{padding:36px 24px 28px;max-width:none}
  .v-blog .news__p{font-size:16px}
  .v-blog .news__field{height:auto;flex-direction:column;align-items:stretch;gap:6px}
  .v-blog .news__field .btn{width:100%}
  .v-blog .news__field input{flex:none;width:100%}
  .v-blog .news__ph{min-height:0;aspect-ratio:16/9}
}
</style>
<script>
addDict({
pt:{bl_title:'Blog',bl_h1:'Guia de imóveis em Pipa',bl_p:'Custos, documentos, terrenos e aluguel por temporada, explicados por quem acompanha os negócios na região.',
 bl_nh:'Novos artigos por e-mail',bl_np:'Um e-mail quando sai um artigo novo. Sem anúncios de terceiros, e você cancela quando quiser.',bl_ph:'Seu e-mail',bl_btn:'Receber artigos',bl_alt:'Vista aérea do mar em Pipa'},
en:{bl_title:'Blog',bl_h1:'Property guide for Pipa',bl_p:'Costs, documents, land and holiday lets, explained by the people who follow the deals in the area.',
 bl_nh:'New articles by email',bl_np:'One email when a new article is out. No third-party ads, and you can unsubscribe at any time.',bl_ph:'Your email',bl_btn:'Get articles',bl_alt:'Aerial view of the sea at Pipa'},
de:{bl_title:'Blog',bl_h1:'Ratgeber für Immobilien in Pipa',bl_p:'Kosten, Unterlagen, Grundstücke und Ferienvermietung, erklärt aus der täglichen Arbeit vor Ort.',
 bl_nh:'Neue Artikel per E-Mail',bl_np:'Eine E-Mail, sobald ein neuer Artikel erscheint. Keine Werbung Dritter, jederzeit abbestellbar.',bl_ph:'Ihre E-Mail-Adresse',bl_btn:'Artikel erhalten',bl_alt:'Luftbild des Meeres bei Pipa'}});

VIEWS.blog={
  title(){return tr('bl_title')},
  render(){
    const card=p=>`<a class="post" href="#artigo-${p.slug}">
      <div class="post__ph"><img ${srcW(p.img)} alt="${esc(L(p.title))}" loading="lazy"><div class="post__meta"><time datetime="${p.date}">${fdate(p.date)}</time><i></i><span>${esc(L(p.cat))}</span></div></div>
      <h2 class="post__t">${esc(L(p.title))}</h2></a>`;
    return `<div class="v-blog">
<section class="head"><div class="wrap"><h1 class="head__t">${tr('bl_h1')}</h1><p class="head__p">${tr('bl_p')}</p></div></section>
<section class="grid"><div class="wide grid__g">${SITE.posts.map(card).join('')}</div></section>
<section class="news"><div class="wrap"><div class="news__box dark">
  <div class="news__txt"><h2 class="news__h">${tr('bl_nh')}</h2><p class="news__p">${tr('bl_np')}</p>
    <form class="news__f" data-demo><label class="news__lbl" for="bl-mail">${tr('bl_ph')}</label>
      <div class="news__field"><input id="bl-mail" type="email" required autocomplete="email" placeholder="${tr('bl_ph')}"><button class="btn" type="submit">${tr('bl_btn')}</button></div>
      <div class="ok" role="status"></div></form></div>
  <div class="news__ph"><img ${srcW('21')} alt="${tr('bl_alt')}" loading="lazy"></div>
</div></div></section>
</div>`}
};
</script>
