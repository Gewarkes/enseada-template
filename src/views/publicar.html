<style>
.v-publicar{--pb-err:#a12b22}
.v-publicar .pb-head{padding:110px 0 0}
.v-publicar .pb-in{margin-left:13.8%}
.v-publicar .pb-in .lead{max-width:636px;margin-top:28px;text-wrap:pretty}
.v-publicar .pb-role{display:inline-flex;align-items:flex-start;gap:10px;margin-top:24px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.45;max-width:636px}
.v-publicar .pb-role .ico{color:var(--sea);margin-top:2px}
.v-publicar .pb-role b{font-weight:600}
.v-publicar .pb-hero{margin-top:56px;aspect-ratio:1300/320;overflow:hidden;background:var(--stone)}
.v-publicar .pb-hero img{width:100%;height:100%;object-fit:cover}

.v-publicar .pb-main{padding:100px 0 var(--sec)}
.v-publicar .pb-grid{display:grid;grid-template-columns:minmax(0,760px) minmax(0,380px);justify-content:space-between;gap:60px;align-items:start}
.v-publicar .pb-form{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:44px 32px 36px}
.v-publicar .pb-g{border:0;padding:0;min-width:0;margin:0 0 20px}
.v-publicar .pb-g + .pb-g{border-top:1px solid var(--line);padding-top:36px;margin-top:36px}
.v-publicar .pb-g legend{float:left;width:100%;padding:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.015em}
.v-publicar .pb-hint{clear:both;color:var(--mute);margin:6px 0 24px}
.v-publicar .pb-row{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.v-publicar .pb-row:last-child{margin-bottom:0}
.v-publicar .pb-row .pb-full{grid-column:1/-1}
.v-publicar .f{align-content:start}
.v-publicar .f input,.v-publicar .f select,.v-publicar .f textarea{border-radius:0;border-color:var(--stone)}
.v-publicar .f input:hover,.v-publicar .f select:hover,.v-publicar .f textarea:hover{border-color:var(--mute-d)}
.v-publicar .f [aria-invalid="true"]{border-color:var(--pb-err)}
.v-publicar .pb-err{font-size:14px;font-weight:500;line-height:1.35;color:var(--pb-err)}
.v-publicar .pb-err:empty{display:none}
.v-publicar .pb-seg{display:flex;border:1px solid var(--stone);height:50px;background:var(--white)}
.v-publicar .pb-seg button{flex:1;min-width:0;padding:0 8px;background:none;border:0;font-size:15px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
.v-publicar .pb-seg button + button{border-left:1px solid var(--stone)}
.v-publicar .pb-seg button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.v-publicar .pb-lab{font-size:14px;font-weight:600;margin-bottom:8px}
.v-publicar .pb-other{margin-top:8px}
.v-publicar .pb-note{font-size:14px;line-height:1.5;color:var(--mute);margin-top:10px}
.v-publicar .pb-feats{display:flex;flex-wrap:wrap;gap:12px 24px}
.v-publicar .pb-feats label{display:inline-flex;align-items:center;gap:9px;min-height:26px;font-size:16px;line-height:1.3;cursor:pointer}
.v-publicar .pb-feats input{width:16px;height:16px;margin:0;accent-color:var(--fg);flex:none}
.v-publicar .pb-up{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:1px dashed var(--mute-d);color:var(--mute);font-size:15px;font-weight:500;cursor:pointer;transition:border-color .2s,color .2s}
.v-publicar .pb-up:hover{border-color:var(--fg);color:var(--text)}
.v-publicar .pb-up:focus-within{outline:2px solid var(--sea);outline-offset:3px}
.v-publicar .pb-up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.v-publicar .pb-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.v-publicar .pb-thumbs:empty{display:none}
.v-publicar .pb-thumbs img{width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--stone)}
.v-publicar .pb-fbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:8px;font-size:14px;color:var(--mute)}
.v-publicar .pb-fbar[hidden]{display:none}
.v-publicar .pb-fbar button{background:none;border:0;min-height:44px;padding:0;font-weight:600;color:var(--text);text-decoration:underline;text-underline-offset:4px}
.v-publicar .pb-go{border-top:1px solid var(--line);margin-top:36px;padding-top:32px}
.v-publicar .pb-go .btn{width:100%;height:54px;font-size:16px}
.v-publicar .pb-sum{margin-bottom:14px}
.v-publicar .pb-fine{font-size:14px;line-height:1.5;color:var(--mute);margin-top:14px;text-align:center}

.v-publicar .pb-side{display:grid;gap:25px;align-self:stretch;align-content:start}
.v-publicar .pb-card{border-radius:var(--r);padding:30px;background:var(--white)}
.v-publicar .pb-tips{background:var(--ink);color:#eef0ee}
.v-publicar .pb-card h2{font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.v-publicar .pb-tips li{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line-d);font-size:15px;line-height:1.45}
.v-publicar .pb-tips ul{margin-top:16px}
.v-publicar .pb-tips li:last-child{padding-bottom:0}
.v-publicar .pb-tips .ico{margin-top:2px;color:var(--mute-d)}
.v-publicar .pb-who{display:grid;grid-template-columns:22px 1fr;gap:14px}
.v-publicar .pb-who .ico{width:20px;height:20px;margin-top:3px;color:var(--sea)}
.v-publicar .pb-who h2{font-size:16px;line-height:1.3}
.v-publicar .pb-who p{font-size:14px;line-height:1.5;color:var(--mute);margin-top:6px}
.v-publicar .pb-prev{position:sticky;top:24px}
.v-publicar .pb-prev > p{font-size:14px;color:var(--mute);margin:4px 0 20px}
.v-publicar .pb-prev .pb{pointer-events:none}
.v-publicar .pb-prev .pb__name{overflow-wrap:anywhere}

@media (max-width:1180px){.v-publicar .pb-grid{grid-template-columns:minmax(0,1fr) 340px;gap:40px}}
@media (max-width:980px){
  .v-publicar .pb-grid{grid-template-columns:1fr}
  .v-publicar .pb-prev{position:static}
}
@media (max-width:860px){
  .v-publicar .pb-head{padding-top:48px}
  .v-publicar .pb-in{margin-left:0}
  .v-publicar .pb-hero{margin-top:36px;aspect-ratio:16/9}
  .v-publicar .pb-main{padding-top:56px}
  .v-publicar .pb-form{padding:32px 20px 28px}
  .v-publicar .pb-row{grid-template-columns:1fr;gap:20px;margin-bottom:20px}
  .v-publicar .pb-feats{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .v-publicar .pb-feats label{min-height:44px;font-size:15px}
  .v-publicar .pb-thumbs{grid-template-columns:repeat(3,1fr)}
  .v-publicar .pb-card{padding:24px 20px}
}
</style>
